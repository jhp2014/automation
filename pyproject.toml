[project]
name = "automation"
version = "0.1.0"
description = "Monorepo for KWorks / Zenius / DailyService automation jobs (convention v1.1)"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "playwright>=1.40.0",
    "PyYAML>=6.0",
    # capture 전용: 좌측 모니터 스크린샷 + 윈도우 열거/검증
    "mss>=9.0",
    "Pillow>=10.0",
    "pywin32>=306; sys_platform == 'win32'",
    # runner 전용: jobs.yaml 스키마 검증 + Supabase heartbeat
    "pydantic>=2.0",
    "supabase>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "jobs*", "site_selectors*", "runner*", "tools*"]
exclude = ["tests*"]
