# =============================================================================
# config/jobs.yaml — runner 일정 정의 (규약 v1.1)
#
# 비밀값(토큰·비밀번호·SUPABASE_KEY 등) 절대 금지. 비밀값은 모두 .env 또는
# config/daily.yaml (둘 다 git ignore).
#
# 각 job 은 python -m <module> <args...> 형태로 호출된다.
# 인터프리터 통일 조항: runner 가 자기를 실행한 sys.executable 로 호출한다.
#
# 모드:
#   interval         : interval_sec 마다 1회.
#   hourly_jitter    : 매 시간 [0, jitter_max_sec] 무작위 시점 + grace_sec 윈도우.
#   one_time_list    : times 의 각 at 시각 ± grace_sec 윈도우에서 정확히 1회.
#
# 매일 갱신하는 값들(run_until, server.times, KWorks 자격증명/제목)은 본 파일이
# 아니라 config/daily.yaml 에서 관리한다. 본 파일은 "구조"만 정의한다.
# =============================================================================

# run_until 은 daily.yaml 이 있으면 daily.run_until 로 덮어쓴다.
# 본 값은 daily.yaml 이 없을 때의 폴백.
run_until: "2000-01-01 00:00"            # "YYYY-MM-DD HH:MM" 또는 빈 문자열(무기한)
tick_sec: 10
heartbeat_interval_sec: 60
heartbeat_source: main_runner

jobs:
  # --- Zenius EMS 모니터 (180초 주기) ---
  - name: zenius
    module: jobs.zenius
    mode: interval
    interval_sec: 180
    timeout_sec: 600

  # --- DailyService(SDS) 대시보드 모니터 (600초 주기) ---
  - name: daily_service
    module: jobs.daily_service
    mode: interval
    interval_sec: 600
    timeout_sec: 600

  # --- Jennifer 통합 점검 (600초 주기, Fail-Fast) ---
  # 정상 1회 run 은 4개 사이트 합쳐 ~40s. timeout 은 hang(예: WS 폭주로 Playwright
  # 파이프 단절/MemoryError 후 무응답) 을 빨리 죽여 안전망 알림을 앞당기기 위한 값.
  - name: jennifer
    module: jobs.jennifer
    mode: interval
    interval_sec: 600
    timeout_sec: 120

  # --- AC 캡처 + KWorks 업로드 (매 시간 [0, 600s] 무작위, grace 60s) ---
  # target_title 은 daily.yaml 의 kworks.target_title 에서 읽는다.
  - name: capture
    module: jobs.capture
    mode: hourly_jitter
    jitter_max_sec: 600
    grace_sec: 60
    timeout_sec: 900

  # --- Server upload (one_time_list) ---
  # times 는 daily.yaml 의 server_times 가 있으면 그 값으로 통째로 치환된다.
  # 아래 dummy entry 는 daily.yaml 이 비어 있을 때 pydantic 검증을 통과시키기 위한
  # 안전한 과거 시각(자동으로 grace 초과 -> done 처리되어 실행되지 않음).
  - name: server
    module: jobs.server
    mode: one_time_list
    grace_sec: 300
    timeout_sec: 3600
    times:
      - at: "2000-01-01 00:00"
        args: []
