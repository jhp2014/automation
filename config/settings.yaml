# config/settings.yaml — 동작 토글 (git 추적, 비밀값 금지)
# 우선순위: CLI 인자 > 본 파일.
# 값이 없고 CLI로도 안 주면 해당 job 은 명확한 에러로 종료한다(폴백 없음).
#
# headless        : 브라우저 헤드리스 여부 (false=헤드풀)
# submit_by_enter : KWorks 업로드 후 Enter 최종등록 여부 (server/capture 전용)
# refresh_targets : 캡처 직전 새로고침할 대상 목록(capture 전용, 순서 유지).
# required_targets: 캡처 전 레이아웃/가림 검증을 요구할 대상 목록(capture 전용).
#                   이름은 capture KEYWORDS 의 키(WhatsUp/Zenius/ETL/Dashboard).
#                   refresh_targets 빈 목록([])이면 새로고침 생략.

zenius:
  headless: true

daily_service:
  headless: true

jennifer:
  headless: true

capture:
  headless: true
  submit_by_enter: true
  # daily service 먹통으로 Dashboard 제외 중.
  # 복구되면 required_targets 에 "Dashboard" 를 추가하고
  # refresh_targets 를 ["Dashboard", "Zenius"] 로 되돌릴 것.
  #
  # WhatsUp 은 중간에 둔다: 목록의 마지막 대상이 최종 foreground 로 남아 그대로
  # 캡처되므로, 기존 최종 상태(Zenius)를 바꾸지 않기 위함.
  refresh_targets: ["Dashboard", "WhatsUp", "Zenius"]
  required_targets: ["WhatsUp", "Zenius", "ETL", "Dashboard"]

server:
  headless: true
  submit_by_enter: true
